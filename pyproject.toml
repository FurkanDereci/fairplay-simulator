[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairplay-simulator"
version = "0.0.0"
description = "Sıfırdan çizilmiş FairPlay — sözleşme-önce futbol tahmin/portföy simülatörü"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyjwt>=2.8",
]

[project.scripts]
fairplay-simulator = "fairplay_simulator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3",
    "httpx>=0.27",
    "playwright>=1.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fairplay_simulator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Türkçe metin bilinçli: 'ı' harfi ve matematiksel işaretler (−, →, ↔, ·) dokümanlarda kullanılıyor.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI bağımlılık enjeksiyonu bu çağrıları varsayılan argümanda ister; değişmez sayılırlar.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src/fairplay_simulator"]
