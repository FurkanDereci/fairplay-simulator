name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bağımlılıklar
        run: python -m pip install -e ".[dev]"

      - name: Tarayıcı (UI testleri için)
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Tip
        run: mypy

      - name: Test
        run: pytest -q
